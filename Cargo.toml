[package]
name = "file_away_flow"
version = "1.1.1"
edition = "2021"

[dependencies]
pretty_env_logger = "0.5.0"
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.53.2", features = ["full"] }
warp = { version = "0.4.3", features = ["server"] }
lazy_static = "1.5.1"

[dev-dependencies]
warp = { version = "0.4.3", features = ["test"] }
tempfile = "3.27.0"
serde_json = "1.0.151"

[lib]
name = "file_away_flow"
path = "src/lib.rs"
